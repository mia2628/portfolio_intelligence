name: Portfolio Full Auto Update

on:
  workflow_dispatch:
  schedule:
    # Weekdays 07:30 KST (22:30 UTC previous day)
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: portfolio-full-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pandas numpy requests

      - name: STEP4 - Refresh historical data
        run: python engines/step04_collect_historical_data.py

      - name: STEP11 - Build latest actual inputs
        run: python engines/step11_auto_bridge.py --apply

      - name: STEP3 - Coverage-aware macro engine
        run: python engines/step03_shock_factor_engine.py

      - name: STEP11 - Validate data structure
        run: python engines/step11_final_coverage_check.py

      - name: STEP12 - Run STEP5 to STEP7
        run: python engines/step12_pipeline_runner.py --mode core

      - name: Commit all refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ outputs/ || true
          git diff --cached --quiet || (git commit -m "Auto refresh portfolio intelligence" && git push)
