name: Portfolio Monthly Decision

on:
  workflow_dispatch:
    inputs:
      monthly_amount:
        description: "이번 달 신규 투자금액 (원, 숫자만)"
        required: true
        type: string
      last_review_date:
        description: "마지막 6개월 점검 기준일 (YYYYMMDD)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  decision:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pandas numpy requests
      - run: python engines/step04_collect_historical_data.py
      - run: python engines/step11_auto_bridge.py --apply
      - run: python engines/step03_shock_factor_engine.py
      - run: python engines/step11_final_coverage_check.py
      - run: python engines/step12_pipeline_runner.py --mode core
      - name: STEP8-10 monthly decision
        run: >
          python engines/step12_pipeline_runner.py
          --mode decision
          --amount "${{ inputs.monthly_amount }}"
          --last-review "${{ inputs.last_review_date }}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio.csv data/ outputs/ || true
          git diff --cached --quiet || (git commit -m "Update monthly portfolio decision" && git push)
