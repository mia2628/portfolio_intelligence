name: Portfolio Monthly Decision

on:
  workflow_dispatch:
    inputs:
      monthly_amount:
        description: "이번 달 신규 투자금액 (원, 숫자만)"
        required: true
        type: string
      last_review_date:
        description: "마지막 6개월 점검 기준일 (YYYYMMDD)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: portfolio-monthly-decision
  cancel-in-progress: false

jobs:
  decision:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pandas numpy requests

      # Refresh first so the recommendation always uses the latest available market inputs.
      - name: STEP4 - Refresh historical data
        run: python engines/step04_collect_historical_data.py

      - name: STEP11 - Build latest actual inputs
        run: python engines/step11_auto_bridge.py --apply

      - name: STEP3 - Coverage-aware macro engine
        run: python engines/step03_shock_factor_engine.py

      - name: STEP11 - Validate
        run: python engines/step11_final_coverage_check.py

      - name: STEP5 to STEP7 - Refresh portfolio intelligence
        run: python engines/step12_pipeline_runner.py --mode core

      - name: STEP8 to STEP10 - Build this month's decision
        run: >
          python engines/step12_pipeline_runner.py
          --mode decision
          --amount "${{ inputs.monthly_amount }}"
          --last-review "${{ inputs.last_review_date }}"

      - name: Commit monthly recommendation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ outputs/ || true
          git diff --cached --quiet || (git commit -m "Update monthly portfolio recommendation" && git push)
