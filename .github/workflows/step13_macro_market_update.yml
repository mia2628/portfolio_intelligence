name: STEP13 Macro Market Update

on:
  workflow_dispatch:
  schedule:
    # KST 08:30
    - cron: "30 23 * * *"
    # KST 10:30
    - cron: "30 1 * * *"
    # KST 12:00
    - cron: "0 3 * * *"
    # KST 13:30
    - cron: "30 4 * * *"
    # KST 15:30
    - cron: "30 6 * * *"
    # KST 17:00
    - cron: "0 8 * * *"
    # KST 18:30
    - cron: "30 9 * * *"
    # KST 20:00
    - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: step13-macro-market-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pandas requests

      - name: Build macro risk composite
        run: python engines/step13_macro_risk_engine.py

      - name: Validate macro JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("docs/data/macro_risk.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["current"]["score"] is not None
          assert len(d["points"]) >= 20
          assert d["meta"]["source"] == "FRED"
          print("PASS: macro_risk.json validated.")
          PY

      - name: Commit macro data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/macro_risk.json
          git diff --cached --quiet || (git commit -m "Update STEP13 macro market data" && git push)
