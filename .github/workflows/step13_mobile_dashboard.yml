name: STEP13 Mobile Dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Portfolio Full Auto Update"
      - "Portfolio Monthly Decision"
      - "Portfolio Actual Contribution Update"
    types: [completed]

permissions:
  contents: write
  issues: write

concurrency:
  group: step13-mobile-dashboard
  cancel-in-progress: true

jobs:
  build-dashboard:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export mobile dashboard data
        run: python engines/step13_dashboard_export.py

      - name: Record dashboard trend
        run: python engines/step13_trend_snapshot.py

      - name: Evaluate alerts
        id: alerts
        run: |
          python engines/step13_alert_engine.py
          python - <<'PY'
          import json, os
          d=json.load(open("outputs/step13/alerts.json",encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"count={d['count']}\n")
              f.write(f"signature={d['signature']}\n")
          PY

      - name: Validate live dashboard data
        run: python engines/step13_dashboard_integrity_check.py

      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/dashboard.json docs/data/trend.json docs/data/alerts.json data/dashboard_history.csv outputs/step13/
          git diff --cached --quiet || (git commit -m "Update STEP13 mobile dashboard" && git push)

      - name: Sync GitHub mobile alert issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/alert_body.md
          import json
          d=json.load(open("outputs/step13/alerts.json",encoding="utf-8"))
          print("## Portfolio Intelligence Alert")
          print()
          if not d["active"]:
              print("현재 활성 경보가 없습니다.")
          else:
              for a in d["active"]:
                  print(f"- **[{a['severity']}] {a['title']}** — {a['message']}")
          print()
          print(f"Signature: `{d['signature']}`")
          PY

          TITLE="[Portfolio Alert] 현재 확인 필요"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')

          if [ "${{ steps.alerts.outputs.count }}" -gt "0" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --body-file /tmp/alert_body.md
            else
              gh issue create --title "$TITLE" --body-file /tmp/alert_body.md
            fi
          else
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "현재 활성 경보가 해소되어 자동 종료합니다."
            fi
          fi
