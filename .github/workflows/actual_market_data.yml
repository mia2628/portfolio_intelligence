name: Actual Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 22 * * 1-5"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Collect actual market data
        run: python engines/step11_actual_data_collector.py

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/step11_current_market_data.csv
          git add data/step11_data_diagnostics.csv
          git add data/step03_market_inputs_actual.csv
          git diff --cached --quiet || git commit -m "Update actual market data"
          git push
