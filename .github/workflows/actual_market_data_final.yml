name: Actual Market Data Final

on:
  workflow_dispatch:
  schedule:
    # 07:15 KST on weekdays (22:15 UTC previous day)
    - cron: "15 22 * * 1-5"

permissions:
  contents: write

jobs:
  collect-and-connect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --upgrade requests

      - name: Collect and apply actual data
        run: python engines/step11_final_actual_connector.py --apply

      - name: Validate STEP11 to STEP3 connection
        run: python engines/step11_connection_check.py

      - name: Run STEP3 with actual inputs
        run: python engines/step03_shock_factor_engine.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/step11_current_market_data.csv
          git add data/step11_data_diagnostics.csv
          git add data/step03_market_inputs_actual.csv
          git add data/step03_market_inputs.csv
          git add data/step03_market_inputs_template.csv || true
          git add data/step03_results.csv || true
          git diff --cached --quiet || git commit -m "Update actual market inputs and STEP3 results"
          git push
