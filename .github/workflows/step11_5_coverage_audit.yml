name: STEP11.5 Coverage Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit all 27 indicators
        run: python engines/step11_5_coverage_audit.py

      - name: Save coverage report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/step11_5_coverage_report.csv data/step11_5_coverage_summary.csv
          git diff --cached --quiet || git commit -m "Audit 27-indicator data coverage"
          git push

      # Strict gate is intentionally NOT run automatically yet.
      # Run it after exact data/licensing/definitions are completed:
      # python engines/step11_5_strict27_gate.py
