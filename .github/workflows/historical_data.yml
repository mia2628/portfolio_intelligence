name: Build historical data

on:
  workflow_dispatch:

  schedule:
    - cron: "15 2 2 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install pandas numpy requests

      # ------------------------------------------------------
      # STEP 4-1
      # Collect actual historical market data
      # ------------------------------------------------------

      - name: Collect historical data
        run: |
          python engines/step04_collect_historical_data.py

      # ------------------------------------------------------
      # STEP 4-2
      # Run historical calibration immediately
      # using the newly collected historical_data.csv
      # ------------------------------------------------------

      - name: Run historical calibration
        run: |
          python engines/step04_historical_calibration_engine.py

      # ------------------------------------------------------
      # Check generated files
      # ------------------------------------------------------

      - name: Show STEP 4 outputs
        run: |
          echo "===== historical data ====="
          ls -lh data/historical/

          echo "===== step04 outputs ====="
          ls -lh outputs/step04/ || true

      # ------------------------------------------------------
      # Commit everything generated by STEP 4
      # ------------------------------------------------------

      - name: Commit STEP 4 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/historical/historical_data.csv
          git add outputs/step04/

          git diff --cached --quiet || git commit -m "Update STEP 4 historical calibration"
          git push
